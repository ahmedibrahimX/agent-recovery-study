name: Verify saved study

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  saved-evidence:
    name: Saved evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Confirm preserved study bytes
        run: python3 tools/check_package.py
      - name: Reproduce saved verdicts (expected agent failures included)
        run: python3 -E -s -B study/verify.py
      - name: Run original UAT negative controls
        run: python3 -E -s -B -m unittest discover -s study -p test_verifier.py -v
      - name: Confirm the checks left study bytes unchanged
        run: python3 tools/check_package.py

